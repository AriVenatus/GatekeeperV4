[build-system]
requires      = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GatekeeperV4"
dynamic = ["version"]
authors = [
    { name = "Ari", email = "arivenatus@gmail.com" },
    { name = "Leon Breidenbach", email = "gatekeeperv3@gta-5.de" },
    { name = "k8thekat (previous dev)", email = "Cadwalladerkatelynn+Gatekeeper@gmail.com" }

]
description = "A Discord Bot for Cube Coders AMP"
readme = { file = "README", content-type = "text/markdown" }
requires-python = ">=3.13.0"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
GitHub    = "https://github.com/AriVenatus/GatekeeperV4"
Changelog = "https://github.com/AriVenatus/GatekeeperV4/blob/main/docs/changelog.md"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools]
packages             = ["ampapi"]
include-package-data = true

[tool.ruff]
target-version = "py313"
line-length    = 125

[tool.ruff.lint]
exclude = ["docs/resources/*.py"]
# ANN (flake8-annotations) is deliberately NOT selected. It was 649/1051 (62%) of
# all lint errors as of 2026-08-15: ~454 are return-type rules (ANN201/ANN202/ANN204),
# which pyright already infers from the function body, so annotating them is pure
# explicitness with no analytical payoff. The remaining ~195 are parameter-annotation
# rules (ANN001/ANN003), which would add real information, but pyright currently has
# 1420 errors dominated by causes annotations don't touch (741 reportAttributeAccessIssue,
# mostly AMPInstance's dynamic setattr() injection of AMP's API response plus the
# haggis-added logger.dev/logger.command levels pyright can't see; 266
# reportOptionalMemberAccess). Net effect of enabling ANN today: it silences this
# category in ruff while leaving pyright's real error count roughly unchanged.
# Re-evaluate once the pyright error count above is meaningfully reduced.
select = [
    "A",
    "C4",
    "F",
    "G",
    "I",
    "PTH",
    "RUF",
    "SIM",
    "TCH",
    "UP",
    "W",
    "PERF",
]
ignore = [
    "F401",
    "F402",
    "F403",
    "F405",
    "PERF203",
    "RUF001",
    "RUF009",
    "SIM105",
    "UP034",
    "UP007",
    "G004",
    "G003",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
combine-as-imports      = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses    = false
mark-parentheses       = false
parametrize-names-type = "tuple"

[tool.pyright]
useLibraryCodeForTypes           = true
typeCheckingMode                 = "basic"
pythonVersion                    = "3.13"
reportIncompatibleMethodOverride = false
